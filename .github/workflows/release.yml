name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Python for asset checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check assets
        run: python tests/check_assets.py
      - name: Compile and verify
        run: |
          dotnet restore Source/SarniaPrototype.csproj
          dotnet build Source/SarniaPrototype.csproj -c Release --no-restore
          dotnet run --project Source/SarniaPrototype.csproj -c Release --no-build -- --verify
      - name: Publish Windows x64 self-contained build
        run: dotnet publish Source/SarniaPrototype.csproj -c Release -r win-x64 --self-contained true -o dist/publish
      - name: Package release with attribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'manual' }
          $stage = 'dist/BluewaterHaul'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path 'dist/publish/*' -Destination $stage -Recurse -Force
          Copy-Item -Path 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'Source/FONT_LICENSE.txt' -Destination $stage
          New-Item -ItemType Directory -Force -Path "$stage/MapSource" | Out-Null
          Copy-Item -Path 'MapSource/sarnia.osm.pbf' -Destination "$stage/MapSource/"
          $zip = "dist/BluewaterHaul-$tag-win-x64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal -Force
          Write-Output "Release archive: $zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bluewater-haul-win-x64
          path: dist/*-win-x64.zip
          if-no-files-found: error
      - name: Create GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag "dist/BluewaterHaul-$tag-win-x64.zip" --title "Bluewater Haul $tag" --notes-file RELEASE_NOTES.md --prerelease
