name: Feature request
description: Propose a focused improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or motivation
      description: What part of gameplay or tooling needs improvement?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed behaviour
      description: How should this work in-game?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Accuracy or licensing concerns
      description: Note any real-world map data, external assets or location accuracy implications.
